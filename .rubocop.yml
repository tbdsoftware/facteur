inherit_from: .tbds/rubocop.yml

AllCops:
  TargetRailsVersion: 7.0

Tbds/EnumValueAsString:
  Exclude:
    # status is an integer column in every host database: string values need a migration in each of them
    - "app/models/facteur/mailing.rb"

Tbds/EnumUsePrefixOrSuffix:
  Exclude:
    # A prefix would rename the generated status methods and scopes host apps call
    - "app/models/facteur/mailing.rb"

Layout/EmptyLinesAroundBlockBody:
  Exclude:
    # Generated by db:schema:dump, never edited by hand
    - "spec/dummy/db/schema.rb"
