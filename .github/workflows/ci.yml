name: CI

on:
  push:
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bin/rubocop

  rspec:
    name: rspec (Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: '7.1'
            ruby: '3.4'
            gemfile: Gemfile
          - rails: '7.2'
            ruby: '3.4'
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: '8.0'
            ruby: '3.4'
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: '8.1'
            ruby: '4.0'
            ruby-version: '4.0'
            gemfile: gemfiles/rails_8_1.gemfile

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/facteur_test
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version || '.ruby-version' }}
          bundler-cache: true

      - name: Set up the database
        working-directory: spec/dummy
        run: bin/rails db:create db:schema:load

      - name: Run specs
        run: bundle exec rspec
